[project]
name = "the-ledger"
version = "0.1.0"
description = "TRP1 The Ledger - PostgreSQL-backed event store (Phase 1)"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.29.0",
  "openai>=1.40.0",
  "pydantic>=2.6.0",
  "python-dotenv>=1.0.0",
  "fastmcp>=3.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0,<0.24",
]
